
services:
  mlflow:
    image: python:3.10-slim
    working_dir: /app
    volumes:
      - ./mlflow.db:/app/mlflow.db
      - ./notebooks/mlruns:/app/notebooks/mlruns
    command: >
      sh -c "pip install --no-cache-dir mlflow==3.16.1 &&
      mlflow server
      --backend-store-uri sqlite:////app/mlflow.db
      --host 0.0.0.0
      --port 5000
      --allowed-hosts 'mlflow:5000,localhost:*,127.0.0.1:*'"
    ports:
      - "5000:5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "8000:8000"
    depends_on:
      mlflow:
        condition: service_healthy


  ui:
    image: python:3.10-slim
    working_dir: /app
    volumes:
      - ./ui:/app/ui
    environment:
      API_URL: "http://api:8000/predict"  
    command: >
      sh -c "pip install --no-cache-dir streamlit requests &&
      streamlit run ui/streamlit_app.py
      --server.address 0.0.0.0
      --server.port 8501"
    ports:
      - "8501:8501"
    depends_on:
      - api
